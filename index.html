<!--
Lista de Dicas Git
Comandos essenciais:
  - git init: Cria um repositório
  - git clone <url>: Baixa um repo existente
  - git status: Mostra o que mudou
  - git add .: Prepara as alterações
  - git commit -m "...": Salva uma versão
  - git log: Histórico de commits
  - git branch: Lista as ramificações
  - git push: Envia para o remoto
  - git pull: Traz do remoto
  - git remote -v: Mostra os remotos
-->
